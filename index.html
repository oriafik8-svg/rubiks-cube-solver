</div>
<div id="boot-error"></div>

  window.addEventListener('load', function() {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof THREE === 'undefined') {

    }
  });
  // Surfaces any uncaught error directly on the page (in Hebrew, screenshot-able) instead of only
  // going to a devtools console most people can't easily reach on mobile.
  window.addEventListener('error', function(e) {
    var box = document.getElementById('boot-error');
    var msg = 'שגיאה: ' + (e.message || 'לא ידוע') +
      '\nקובץ/שורה: ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') +

    box.textContent = (box.textContent ? box.textContent + '\n\n---\n\n' : '') + msg;
    box.className = 'show';
  });
</script>
